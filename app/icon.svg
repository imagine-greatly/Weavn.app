<svg width="600" height="650" viewBox="62 168 76 68" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="hg" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rg" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="62" y="168" width="76" height="68" rx="12" ry="12" fill="#050810"/>

  <!-- ring 3 — blue, outermost -->
  <polygon points="100,180 120.8,192 120.8,216 100,228 79.2,216 79.2,192" fill="none" stroke="#6F9BC6" stroke-width="0.8" opacity="0.38" filter="url(#rg)" style="fill:none;stroke:rgb(111, 155, 198);color:rgb(255, 255, 255);stroke-width:0.8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.38;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- ring 2 — green -->
  <polygon points="100,188 117.3,198 117.3,218 100,228 82.7,218 82.7,198" fill="none" stroke="#00C48C" stroke-width="1" opacity="0.62" filter="url(#rg)" style="fill:none;stroke:rgb(0, 196, 140);color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.62;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

