<svg width="512" height="512" viewBox="73 177 54 54" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="hg" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rg" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ring 3 — blue, outermost -->
  <polygon points="100,180 120.8,192 120.8,216 100,228 79.2,216 79.2,192" fill="none" stroke="#6F9BC6" stroke-width="1.3" opacity="0.55" filter="url(#rg)"/>

  <!-- ring 2 — green -->
  <polygon points="100,188 117.3,198 117.3,218 100,228 82.7,218 82.7,198" fill="none" stroke="#00C48C" stroke-width="1.7" opacity="0.72" filter="url(#rg)"/>

  <!-- ring 1 — purple -->
  <polygon points="100,196 113.9,204 113.9,220 100,228 86.1,220 86.1,204" fill="none" stroke="#8080c0" stroke-width="2.1" opacity="0.9" filter="url(#rg)"/>

  <!-- core hex -->
  <polygon points="100,204 110.4,210 110.4,222 100,228 89.6,222 89.6,210" fill="none" stroke="#FFFFFF" stroke-width="2.6" filter="url(#hg)" opacity="0.97"/>
  <polygon points="100,207 107,211 107,221 100,225 93,221 93,211" fill="none" stroke="#FFFFFF" stroke-width="0.55" opacity="0.32"/>
  <circle cx="100" cy="216" r="2.4" fill="#FFFFFF" opacity="0.97"/>
</svg>
