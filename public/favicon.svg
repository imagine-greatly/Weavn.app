<svg xmlns="http://www.w3.org/2000/svg" viewBox="-270 -270 540 540" width="800" height="800">
  <rect x="-270" y="-270" width="540" height="540" fill="#050810"/>
  <defs>
    <filter id="ekgGlow" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="3" result="b1"/>
      <feGaussianBlur stdDeviation="8" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bracketGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#bracketGlow)">
    <line x1="40" y1="-210" x2="210" y2="-210" stroke="#00C8FF" stroke-width="2.5" stroke-linecap="square"/>
    <line x1="210" y1="-210" x2="210" y2="-40" stroke="#00C8FF" stroke-width="2.5" stroke-linecap="square"/>
    <line x1="-210" y1="40" x2="-210" y2="210" stroke="#00C8FF" stroke-width="2.5" stroke-linecap="square"/>
    <line x1="-210" y1="210" x2="-40" y2="210" stroke="#00C8FF" stroke-width="2.5" stroke-linecap="square"/>
  </g>
  <g filter="url(#ekgGlow)" opacity="0.85">
    <polyline
      points="-270,0 -70,0 -35,0 -16,-75 0,75 16,-32 38,0 270,0"
      fill="none" stroke="#00C8FF" stroke-width="2.5"
      stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
