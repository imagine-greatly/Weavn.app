<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="32" height="32">
  <rect width="800" height="800" fill="#050810"/>
  <defs>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="10" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(400,400)">
    <g filter="url(#softglow)">
      <line x1="30" y1="-200" x2="200" y2="-200" stroke="#00C8FF" stroke-width="14" stroke-linecap="square"/>
      <line x1="200" y1="-200" x2="200" y2="-30" stroke="#00C8FF" stroke-width="14" stroke-linecap="square"/>
      <line x1="-200" y1="30" x2="-200" y2="200" stroke="#00C8FF" stroke-width="14" stroke-linecap="square"/>
      <line x1="-200" y1="200" x2="-30" y2="200" stroke="#00C8FF" stroke-width="14" stroke-linecap="square"/>
    </g>
    <g filter="url(#glow)" opacity="0.7">
      <line x1="-260" y1="0" x2="-60" y2="0" stroke="#00C8FF" stroke-width="3.5" stroke-linecap="round"/>
      <polyline points="-60,0 -30,0 -15,-70 0,70 15,-30 35,0 260,0" fill="none" stroke="#00C8FF" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
  </g>
</svg>
