<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <rect width="800" height="800" fill="#050810"/>
  <defs>
    <filter id="logoGlow" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="logoBracketGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(400,400)">
    <g filter="url(#logoBracketGlow)">
      <line x1="40" y1="-210" x2="210" y2="-210" stroke="#00C8FF" stroke-width="2.5" stroke-linecap="square"/>
      <line x1="210" y1="-210" x2="210" y2="-40" stroke="#00C8FF" stroke-width="2.5" stroke-linecap="square"/>
      <line x1="-210" y1="40" x2="-210" y2="210" stroke="#00C8FF" stroke-width="2.5" stroke-linecap="square"/>
      <line x1="-210" y1="210" x2="-40" y2="210" stroke="#00C8FF" stroke-width="2.5" stroke-linecap="square"/>
    </g>
    <g filter="url(#logoGlow)" opacity="0.6">
      <line x1="-270" y1="0" x2="-70" y2="0" stroke="#00C8FF" stroke-width="2.5" stroke-linecap="round"/>
      <polyline points="-70,0 -35,0 -16,-75 0,75 16,-32 38,0 270,0" fill="none" stroke="#00C8FF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
  </g>
</svg>
